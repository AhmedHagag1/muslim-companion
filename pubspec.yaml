name: quran_app
description: "A modern Quran application built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3
  adhan_dart: ^2.0.1
  timezone: ^0.11.1
  http: ^1.6.0
  shared_preferences: ^2.5.3
  scrollable_positioned_list: ^0.3.8
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  flutter_device_compass: ^2.0.1
  crypto: ^3.0.6
  hijri_core: ^1.0.1
  share_plus: ^13.3.0
  file_picker: 12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/design/
    - assets/quran/quran-uthmani.txt
    - assets/religious_content/daily_worship_ar_manifest.json
    - assets/religious_content/daily_worship_ar_payload.json
    - assets/mushaf/madina_page_boundaries.json
    - assets/quran_study/manifest.json
    - assets/quran_study/english_rwwad.json
    - assets/quran_study/arabic_moyassar.json
    - assets/quran_study/arabic_seraj.json

  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
