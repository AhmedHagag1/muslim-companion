name: Bug report
description: Report a reproducible Muslim Companion defect without private data.
body:
  - type: textarea
    id: description
    attributes: {label: Description}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: App version and platform}
    validations: {required: true}
  - type: textarea
    id: notes
    attributes: {label: Additional context, description: Do not attach backups, exact location, or private religious/personal history.}
